version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: study_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: study_system
      MYSQL_USER: study_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-study_password_change_me}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"  # 可选：仅开发时暴露端口，生产环境建议注释掉
    volumes:
      # 数据持久化：MySQL数据目录挂载到宿主机
      - ./data/mysql:/var/lib/mysql
      # 初始化脚本：首次启动时自动执行
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # MySQL配置文件
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # 日志目录
      - ./logs/mysql:/var/log/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端API服务
  backend:
    build:
      context: ./study-backend
      dockerfile: Dockerfile
    container_name: study_backend
    restart: always
    environment:
      # 数据库连接（通过服务名连接）
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: study_system
      DB_USER: study_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-study_password_change_me}
      # 大模型API密钥
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # JWT密钥
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_change_me}
      # OSS配置
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      TZ: Asia/Shanghai
    ports:
      - "3000:3000"
    volumes:
      # 上传文件目录持久化
      - ./data/uploads:/app/uploads
      # 日志目录
      - ./logs/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - study_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 定时任务服务（可选，可以和backend合并）
  scheduler:
    build:
      context: ./study-backend
      dockerfile: Dockerfile
    container_name: study_scheduler
    restart: always
    command: ["java", "-jar", "app.jar", "--spring.profiles.active=scheduler"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: study_system
      DB_USER: study_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-study_password_change_me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TZ: Asia/Shanghai
    volumes:
      - ./logs/scheduler:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - study_network

networks:
  study_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

server:
  port: 3000
  servlet:
    context-path: /api

spring:
  application:
    name: study-system

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:study_system}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:study_user}
    password: ${DB_PASSWORD:password}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.study.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_at_least_32_characters_long}
  expiration: 604800000  # 7天

# 大模型API配置
ai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    api-url: https://api.anthropic.com/v1/messages
    model: claude-3-5-sonnet-20241022
    max-tokens: 4096

# OSS配置（可选）
oss:
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket: ${OSS_BUCKET:}
  endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}

# 文件上传配置
upload:
  path: ${UPLOAD_PATH:/app/uploads}
  max-size: 10485760  # 10MB

logging:
  level:
    com.study: DEBUG
    com.study.mapper: DEBUG
  file:
    name: logs/study-system.log
    max-size: 100MB
    max-history: 30
